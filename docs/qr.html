<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<title>Table Sign · Book Club Lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=17">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body class="sign-page">
<div class="poster">
<div class="awning"></div>
<header class="sign"><div class="board"><p class="kicker">Book Club</p><h1 class="neon">Lunch</h1></div></header>
<p class="scan">Scan to order</p>
<div class="qr" id="qr"></div>
<p class="url" id="url"></p>
<div class="checker"></div>
</div>
<button class="primary print-btn" style="width:auto" onclick="print()">Print</button>
<script>
  // Points at the guest page this sign was opened from (keeps ?event= for tests).
  const url = new URL('./', location.href).href + location.search;
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  document.getElementById('url').textContent = url;
</script>
</body>
</html>
