<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon QR Sign Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root { --wall: #17110f; --red: #ff2e48; --mint: #3dffd0; --chrome: #cfd4d9; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 16px;
    background:
      radial-gradient(ellipse 420px 520px at 50% 46%, rgba(255, 46, 72, .22), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(0,0,0,.35) 38px 41px),
      repeating-linear-gradient(90deg, transparent 0 86px, rgba(0,0,0,.28) 86px 89px),
      var(--wall);
    font-family: Oswald, sans-serif; color: #fff; }
  .scene { display: grid; justify-items: center; gap: 0; }
  /* the red neon tube that runs around the plaque */
  .sign { position: relative; width: 340px; padding: 26px 26px 22px; border-radius: 34px;
    background: #211816;
    border: 5px solid #ffd3d9;
    box-shadow: 0 0 6px #ff8a96, 0 0 18px var(--red), 0 0 42px var(--red), 0 0 80px rgba(255,46,72,.55),
                inset 0 0 14px rgba(255,46,72,.55);
    animation: buzz 7s infinite 2s; }
  .kicker { display: block; width: max-content; margin: 0 auto; font: 700 13px/1 Oswald; letter-spacing: .32em;
    text-transform: uppercase; color: #eafff9; padding: 7px 10px 6px 14px; border: 2px solid #eafff9; border-radius: 999px;
    text-shadow: 0 0 4px #fff, 0 0 10px var(--mint), 0 0 20px var(--mint);
    box-shadow: 0 0 8px var(--mint), 0 0 18px var(--mint), inset 0 0 8px var(--mint); }
  .script { margin: 10px 0 16px; text-align: center; font: 400 58px/1 Yellowtail, cursive; transform: rotate(-4deg);
    color: #fff1f2; text-shadow: 0 0 2px #fff, 0 0 8px #ff6b7a, 0 0 18px var(--red), 0 0 36px var(--red), 0 0 60px var(--red); }
  /* the backlit QR panel: glowing warm-white plastic with raised black squares, in a chrome bezel */
  .bezel { padding: 9px; border-radius: 18px;
    background: linear-gradient(145deg, #f7f9fa, #9aa1a8 45%, #e3e7ea 70%, #8e959c);
    box-shadow: 0 6px 14px rgba(0,0,0,.6); }
  .panel { border-radius: 10px; padding: 0;
    background: radial-gradient(circle at 50% 45%, #fffdf6, #fff3d6 70%, #ffe7b8);
    box-shadow: inset 0 0 22px rgba(255, 200, 120, .55), 0 0 30px rgba(255, 236, 200, .45); }
  .panel svg { display: block; width: 100%; height: auto; filter: drop-shadow(1px 1.5px 0 rgba(0,0,0,.35)); }
  .under { margin-top: 14px; text-align: center; font: 700 22px/1 Oswald; letter-spacing: .22em; text-transform: uppercase;
    color: #fff; text-shadow: 0 0 4px #fff, 0 0 10px var(--mint), 0 0 22px var(--mint); }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 34px; height: 34px; color: #ffc62c; filter: drop-shadow(0 0 6px #ffc62c); }
  /* chrome foot the plaque stands in, with a little checkerboard trim */
  .foot { width: 260px; height: 30px; margin-top: -2px; border-radius: 0 0 14px 14px;
    background: linear-gradient(#f4f6f8, #8e959c 60%, #d5dadf); box-shadow: 0 10px 20px rgba(0,0,0,.6); position: relative; }
  .foot::after { content: ''; position: absolute; left: 14px; right: 14px; top: 9px; height: 10px;
    background: repeating-conic-gradient(#1f1a17 0 25%, #fff 0 50%) 0 0 / 10px 10px; border-radius: 2px; }
  .table { width: 460px; max-width: 94vw; height: 14px; border-radius: 50%; margin-top: 6px;
    background: radial-gradient(ellipse at center, rgba(255,46,72,.45), transparent 70%); }
  @keyframes buzz { 0%, 92%, 94.5%, 100% { opacity: 1; } 93%, 95.5% { opacity: .82; } }
</style></head>
